syntax = "proto3";
package cypher;

import "common.proto";
import "expr.proto";

message FileInfo {
    string path = 1;
}

message ReadCSV {
    message options {
        string delimiter = 1; // Character that separates different columns in a lines, default is ','
        bool header = 2; // Whether the first line of the CSV file is the header. Can be true or false, default is false 
        uint64_t skip_num = 3; // Number of rows to skip from the input file, default is 0
        string quote_char = 4; // Character to start a string quote, default is '"'
        string escape_char = 5; // Character within string quotes to escape QUOTE and other characters, default is '\'
        bool ignore_errors = 6; // Skips malformed rows in CSV files if set to true, default is false
        bool auto_detection = 7; // Automatically detect HEADER, DELIM, QUOTE, ESCAPE if not manually set, default is true
        boolean parallel = 8; // Whether to read the CSV file in parallel, default is true
    }

    FileInfo file_info = 1;
    options csv_options = 2;
}


message DataSource {
    oneof source {
        ReadCSV read_csv = 1;
    }
}

message ColumnMapping {
    message Column {
        int32 index = 1;
        string name = 2;
    }
    common.Property property = 1;
    Column column = 2;
}

message BatchInsertVertex {
    VertexType vertex_type = 1;
    repeated ColumnMapping column_mappings = 2;
}

message BatchInsertEdge {
    EdgeType edge_type = 1;
    repeated ColumnMapping source_vertex_binding = 2;
    repeated ColumnMapping destination_vertex_binding = 3;
    repeated ColumnMapping property_mappings = 4;
}

message DataMapping {
    common.Property property = 1;
    common.Expression dataExpr = 2;
}

message InsertVertex {
    VertexType vertex_type = 1;
    repeated DataMapping property_mappings = 2;
    common.NameOrId tag = 3;
    ConflictAction conflict_action = 4;
}

message InsertEdge {
    EdgeType edge_type = 1;
    common.NameOrId source_vertex_binding = 2;
    common.NameOrId destination_vertex_binding = 3;
    repeated DataMapping property_mappings = 4;
    common.NameOrId tag = 5;
    ConflictAction conflict_action = 6;
}

message MultiInsertVertex {
    repeated InsertVertex insert_vertices = 1;
}

message MultiInsertEdge {
    repeated InsertEdge insert_edges = 1;
}

message SetVertexProperty {
    common.NameOrId vertex_binding = 1;
    DataMapping property_mapping = 2;
}

message SetEdgeProperty {
    common.NameOrId edge_binding = 1;
    DataMapping property_mapping = 2;
}

message MultiSetVertexProperty {
    repeated SetVertexProperty set_vertex_properties = 1;
}

message MultiSetEdgeProperty {
    repeated SetEdgeProperty set_edge_properties = 1;
}

message DeleteVertex {
    enum type {
        DELETE = 0;
        DETACH_DELETE = 1;
    }
    common.NameOrId vertex_binding = 1;
}

message DeleteEdge {
    common.NameOrId edge_binding = 1;
}

message MultiDeleteVertex {
    repeated DeleteVertex delete_vertices = 1;
}

message MultiDeleteEdge {
    repeated DeleteEdge delete_edges = 1;
}